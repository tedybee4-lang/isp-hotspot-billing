  #   environment:
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
  #     POSTGRES_DB: postgres
  #   volumes:
  #     - supabase-db:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
