# =============================================================================
#  ISPFlow — VPS deployment (Docker Compose)
#
#  Option A: host the SPA only, pointing at Supabase Cloud (recommended).
#  Option B: also run self-hosted Supabase for full data sovereignty.
#           See deploy/supabase/README.md
# =============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # These are PUBLIC values — the anon key is designed to ship in the
        # browser (row-level security is what protects your data).
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set VITE_SUPABASE_URL in .env}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?set VITE_SUPABASE_ANON_KEY in .env}
        VITE_APP_NAME: ${VITE_APP_NAME:-ISPFlow}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost}
        VITE_SUPER_ADMIN_EMAILS: ${VITE_SUPER_ADMIN_EMAILS:-}
    image: ispflow-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Optional: self-hosted Supabase on the same VPS.
  # Uncomment the `supabase` service and run `docker compose --profile selfhost up -d`.
  # Requires at least 4 GB RAM.
  # ---------------------------------------------------------------------------
  # supabase:
  #   image: supabase/postgres:15.8.1
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
  #     POSTGRES_DB: postgres
  #   volumes:
  #     - supabase-db:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ---------------------------------------------------------------------------
  # Provisioning engine (FastAPI backend in ./backend) + its data services.
  # Run with the backend profile:
  #   docker compose --profile backend up -d --build
  # The engine's entrypoint runs Alembic migrations, then uvicorn.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    profiles: ["backend"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required for the backend profile}
      POSTGRES_DB: ${POSTGRES_DB:-ispbilling}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["backend"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    image: ispflow-provision-engine:latest
    restart: unless-stopped
    profiles: ["backend"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ispbilling}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: ${SECRET_KEY:?required for the backend profile}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      GLOBAL_ADMIN_EMAIL: ${GLOBAL_ADMIN_EMAIL:-}
      GLOBAL_ADMIN_PASSWORD: ${GLOBAL_ADMIN_PASSWORD:-}
      FRONTEND_URL: ${VITE_APP_URL:-http://localhost}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      CORS_ORIGINS: '["${VITE_APP_URL:-http://localhost}"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  # supabase-db:

  pgdata:
  redisdata: