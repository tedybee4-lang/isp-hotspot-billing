[pytest]
# Pytest configuration for ISP Billing System tests
#
# The section header must be `[pytest]` in a file named pytest.ini. The previous
# `[tool:pytest]` header is only honoured in setup.cfg, so pytest loaded this
# file, found no recognised section, and silently discarded *every* option below
# -- including `asyncio_mode = auto`. That is what produced 43 occurrences of
# "async def functions are not natively supported": no async test could ever run.
#
# Coverage settings were moved to backend/pyproject.toml ([tool.coverage.*]) so
# this file holds pytest configuration only.

# Test discovery.
# `*_test.py` is kept alongside `test_*.py`: tests/mikrotik_provisioning_test.py
# uses the suffix form and would otherwise stop being collected.
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
# `--strict-config` is intentional: from now on an unrecognised ini option is a
# hard failure rather than a silent no-op, which is exactly the class of bug that
# hid the broken section header.
addopts =
    -ra
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    api: API endpoint tests
    mpesa: MPESA integration tests
    slow: Slow running tests
    requires_db: Tests that require database
    requires_redis: Tests that require Redis
    requires_mpesa: Tests that require MPESA API

# Asyncio configuration.
# `auto` is what lets a bare `async def test_...` run. The loop scope stays
# `function` because conftest.py builds a fresh NullPool engine per test, and an
# asyncpg pool bound to another loop cannot be reused.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
