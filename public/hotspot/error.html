<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hotspot Sign-in Error</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <p class="eyebrow">Sign-in failed</p>
        <h1>Unable to connect</h1>
        <p class="lead">$(error)</p>
        <a class="button" href="$(link-login-only)">Try again</a>
      </section>
    </main>
  </body>
</html>
