<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ultrafaiba Logout</title>
    <link rel="stylesheet" href="style.css" />
    <meta http-equiv="refresh" content="3; url=$(link-login-only)" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <p class="eyebrow">Session Closed</p>
        <h1>Thanks for using Ultrafaiba</h1>
        <p class="lead">You can reconnect any time using your voucher code or phone number.</p>
        <a class="button" href="$(link-login-only)">Go back to login</a>
      </section>
    </main>
  </body>
</html>
