<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hotspot Logout</title>
    <link rel="stylesheet" href="style.css" />
    <meta http-equiv="refresh" content="3; url=$(link-login-only)" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <p class="eyebrow">Session closed</p>
        <h1>You have been disconnected</h1>
        <p class="lead">Sign in again whenever you are ready to reconnect.</p>
        <a class="button" href="$(link-login-only)">Go back to login</a>
      </section>
    </main>
  </body>
</html>
