# =============================================================================
#  ISPFlow — FreeRADIUS clients.
#
#  One entry per MikroTik router allowed to authenticate and account against this
#  server.
#
#  SECURITY
#  --------
#  A RADIUS shared secret authenticates the *server* to the *client*. It does not
#  make the server safe to expose. Anyone who can reach UDP 1812 can send
#  Access-Request packets and try passwords; the secret only proves the reply came
#  from here. An internet-exposed RADIUS server is a credential oracle, so:
#
#    * firewall 1812/1813 to private ranges only (install-vps.sh does this)
#    * give every router its own secret, never one shared secret for all
#    * rotate a secret when a router is decommissioned or suspected
#
#  Generate a secret with:  openssl rand -base64 32
#
#  ── How to find a router's address ───────────────────────────────────────────
#
#  For a router on the WireGuard tunnel, use its tunnel address (10.77.0.x) —
#  that is the path the worker and RADIUS traffic actually takes, and it works
#  behind CGNAT where the public address is unreachable.
#
#  For a directly reachable router, use its management address.
# =============================================================================

# ── Example: one router behind the WireGuard tunnel ───────────────────────────
#
# client netisp_wg_tunnel {
#     ipaddr = 10.77.0.2
#     secret = PASTE_A_PER_ROUTER_SECRET_HERE
#     nas_type = other
#     virtual_server = default
# }
#
# ── Example: a router on the same LAN as this host ────────────────────────────
#
# client netisp_lan_router {
#     ipaddr = 192.168.1.2
#     secret = PASTE_A_DIFFERENT_PER_ROUTER_SECRET_HERE
#     nas_type = other
#     virtual_server = default
# }
#
# ── MikroTik setup ───────────────────────────────────────────────────────────
#
# On the router, the shared secret must match the one above exactly. Two rules
# people get wrong:
#
#   1. The secret is set PER RADIUS SERVER entry, not on the interface.
#      /radius add secret=<x> address=<router-ip-of-this-vps> service=hotspot,ppp
#
#   2. The MikroTik "address" field is THIS server's address as the router can
#      reach it — the WireGuard tunnel address if the router is behind CGNAT, not
#      the VPS's public IP.
#
# HotSpot and PPPoE are both listed in `service`. A customer can then authenticate
# against either on the same router.

# --- Test client: localhost -------------------------------------------------
#
# With every other entry above commented out, this file defined NO clients at
# all. FreeRADIUS starts and binds 1812/1813, and then silently discards every
# packet it receives, because no client matches:
#
#     Dropping packet: no matching client
#
# so "the port is listening" and "the server works" are different claims. This
# entry exists so the chain can be verified from the host itself.
#
# TEST ONLY. It is bound to 127.0.0.1, which is not routable from anywhere, so it
# grants no remote access. A real router entry belongs alongside it with its own
# secret, never a shared one.
client netisp_localhost_test {
    ipaddr = 127.0.0.1
    secret = TEST_LOCALHOST_SECRET_GENERATED_ON_INSTALL
    nas_type = other
    virtual_server = default
    require_message_authenticator = no
}