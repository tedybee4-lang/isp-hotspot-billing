# =============================================================================
#  ISPFlow — FreeRADIUS server configuration.
#
#  Installed as /etc/freeradius/3.0/radiusd.conf. Only the settings that matter
#  for an ISP deployment are listed, with the reasoning.
#
#  ── Ports ───────────────────────────────────────────────────────────────────
#
#    UDP 1812  authentication   (auth_port)
#    UDP 1813  accounting       (acct_port)
#
#  Both are UDP. A TCP health check against them proves nothing; use `ss -lun` or
#  `radtest`.
#
#  ── Why ipv6 is off ─────────────────────────────────────────────────────────
#
#  MikroTik routers on RouterOS 6 frequently have no usable IPv6 on their WAN
#  while still advertising the address family, which produces accepts that then
#  silently drop the replies. Binding v4 only is the reliable choice; turn
#  `ipv6 = yes` back on once every managed router is known to handle it.
# =============================================================================

prefix = /etc/freeradius
confdir = ${prefix}
modconfdir = ${confdir}/mods-enabled
logdir = /var/log/freeradius

run_dir = /var/run/freeradius
db_dir = ${run_dir}

# ── Identity ─────────────────────────────────────────────────────────────────

hostname = server
domain = netisp
login = netisp
password = PASTE_A_RANDOM_LOCAL_LOGIN_HERE

# ── Database ─────────────────────────────────────────────────────────────────

sql {
    # The real credentials live in sql.conf, installed mode 0640. This file is
    # world-readable; that is the entire reason the database configuration is a
    # separate file rather than inline here.
    sqlconf = ${confdir}/sql.conf
}

# ── Server ports ─────────────────────────────────────────────────────────────

listen {
    type = auth
    ipaddr = *
    port = 0
}

# Reachable from the routers and the tunnel. Never from the public internet —
# an exposed RADIUS server is a credential oracle.
bind_address = 127.0.0.1
bind_address = 10.77.0.1

# ── Hostname resolution ──────────────────────────────────────────────────────

hostname_lookups = no
# `dns` would resolve a router's tunnel name at request time; a DNS outage would
# then become an authentication outage.
resolve_names = no
ipv6 = no

# ── Logging ──────────────────────────────────────────────────────────────────

# Passwords are never logged.
#
# `auth = yes` would write every customer's password on every login attempt,
# which is a credential store by another name. To debug one subscriber, enable it
# for that user alone in the radgroup file, read the log, and turn it off again.
log {
    destination = files
    file = ${logdir}/radius.log
    auth = no
    badpass = no
    goodpass = no
}

# Connects, disconnects and failures: the operational signal.
#
#   tail -f /var/log/freeradius/radius.log
#
# A spike of "no service account for this username" right after a payment means
# the provisioning job has not run yet. That is the first thing to check when a
# paying customer cannot log in.
log {
    destination = syslog
    facility = local0
    connections = yes
    session = no
    requests = no
    requirements = no
    errors = yes
}

# ── Timing ───────────────────────────────────────────────────────────────────
#
# 30s is longer than any router's RADIUS timeout, so a slow database shows up as
# a timeout on our side rather than as a mysterious authentication failure at the
# customer.
max_request_time = 30
cleanup_delay = 5
max_requests = 16

# ── Roaming ──────────────────────────────────────────────────────────────────

# A customer authenticates through any of the ISP's routers, not only the one
# they were last seen on. This is why a laptop keeps working when the user moves
# between sites, and why a session is not pinned to one NAS.
roaming {
    enabled = yes
    type = fast
}

# ── Interoperation ───────────────────────────────────────────────────────────

# Pap/CHAP/MS-CHAP are all enabled because MikroTik uses CHAP for PPPoE and PAP
# or CHAP for HotSpot depending on firmware and the `pap`/`chap` settings on the
# HotSpot user profile. Disabling any of them locks out real customers rather
# than improving security — the shared secret over the tunnel is what protects
# the exchange, not the inner protocol.
login {
    postauth = yes
}

password {
    Pap = yes
    CHAP = yes
    MS-CHAP = yes
}

thread pool {
    start = 4
    min = 4
    max = 32
    spare = 8
    uses = 0
    retry_delay = 30
}

# ── Modules ───────────────────────────────────────────────────────────────────
#
# Not optional. A radiusd.conf with no `modules { }` block makes FreeRADIUS log
# "Cannot find a 'modules' section in the configuration file!" and then load
# nothing: no sql, no pap/chap, and no usable virtual server, so every
# Access-Request is dropped.
#
# The paths below are absolute and written out in full ON PURPOSE. FreeRADIUS
# 3.2.5 does not expand ${modconfdir} (or any variable) in a module reference.
# A reference written as ${modconfdir}/sql fails to parse with:
#
#   Parse error after "modconfdir": unexpected token "}"
#
# even though modconfdir is defined at the top of this file. This was verified
# directly against 3.2.5 on Ubuntu 24.04: the identical block parses when the
# path is literal and fails when it is a variable.
#
# Each of these must exist in mods-enabled; install-vps.sh links them, because a
# name present in mods-available but absent from mods-enabled is a hard parse
# error too. Ubuntu enables most by default but NOT cache.
#
#   sql    sql_load_accounts(), called by the netisp authorize module
#   pap    HotSpot PAP
#   chap   PPPoE CHAP
#   mschap MS-CHAP v2, used by some HotSpot profiles
#   files  local user file fallback
#   cache  session/attribute cache
modules {
    /etc/freeradius/3.0/mods-enabled/cache
    /etc/freeradius/3.0/mods-enabled/pap
    /etc/freeradius/3.0/mods-enabled/chap
    /etc/freeradius/3.0/mods-enabled/mschap
    /etc/freeradius/3.0/mods-enabled/sql
    /etc/freeradius/3.0/mods-enabled/files
}

# ── Virtual server ────────────────────────────────────────────────────────────
#
# Also a literal path, for the same reason: a variable here fails to parse with
# `Parse error after "confdir": unexpected token "}"`.
#
# This line is what makes RADIUS work at all, and its absence is silent:
# without it FreeRADIUS still starts and still opens UDP 1812, so it looks
# healthy, but
#
#   * no `authorize` / `post-auth` section is ever run, so netisp-authorize and
#     netisp-post-auth are never called and every login is rejected, and
#   * the `listen { type = acct }` section lives inside that site, so UDP 1813
#     never opens and no accounting is ever recorded.
#
# Verified on the running host: with the line absent, `ss -lun` shows only
# 1812; with it present, both 1812 and 1813 are bound.
/etc/freeradius/3.0/sites-enabled/default
