# =============================================================================
#  ISPFlow - FreeRADIUS 3 SQL queries.
#
#  FORMAT: this file is read by the `sql` module in FreeRADIUS 3.2.5, whose
#  query definitions are section-bound assignments:
#
#      authorize_check_query   run in the `authorize` section; zero rows = unknown
#      authorize_reply_query   returns rows of (Attribute, Value)
#      accounting { start / interim-update / stop { query } }
#      post-auth { query }
#
#  There is no sql_query() function in FreeRADIUS 3: rlm_sql registers no
#  policy functions at all (`strings rlm_sql.so | grep ^sql_` returns nothing).
#  A policy that calls sql_query() therefore fails with
#      Parse error after "sql_query": unexpected token "("
#  and the module, not the policy, is at fault.
#
#  ------------------------------------------------------------------
#  TENANT SAFETY - the rule this file exists to enforce
#  ------------------------------------------------------------------
#  NOTHING is looked up by username alone.
#
#  The old query was `WHERE sa.username = ... LIMIT 1`. Username is unique per
#  (isp_id, username), not globally, so with two ISPs both running a "john" that
#  could return either tenant's subscriber: the wrong customer authenticated on
#  the wrong ISP's router, at the wrong price. The old comment claimed this
#  "can never return two candidates". It could.
#
#  The tenant is resolved FIRST, from the router that sent the packet, via
#  radius_nas, and the subscriber is then scoped by it. radius_nas.nas_identifier
#  is UNIQUE, so the resolution is single-valued. A router that is not registered
#  matches no row, so an unknown router cannot ask about anybody. The router's
#  identity, not the username, decides whose customers are in play.
#
#  Every query below repeats the same two-table join for that reason. The shape is
#  deliberate, not redundant: there is no code path that reaches service_accounts
#  without passing through radius_nas.
#
#  ------------------------------------------------------------------
#  Passwords
#  ------------------------------------------------------------------
#  service_accounts.password_encrypted holds an OpenPGP-symmetric ciphertext
#  written by set_service_account_password(). CHAP and MS-CHAP cannot be verified
#  against a one-way hash, and MikroTik uses both (PPPoE always, HotSpot usually),
#  so the password has to be recoverable in cleartext for the duration of one
#  authentication. The key is not in this database; it is held by the RADIUS host
#  and arrives as the session GUC netisp.radius_key. A dump of this database, or a
#  stolen radius_reader role, yields nothing.
#
#  The cleartext is returned ONLY as the Cleartext-Password reply attribute. It is
#  never logged: radiusd.conf sets auth, badpass and goodpass to no.
# =============================================================================

sql_user_name = "%{User-Name}"

# --- authorize: does this subscriber exist on THIS router? --------------------
#
# One row, guaranteed. Returning User-Name is what lets rlm_sql match the row
# against the control list; it is already present, so the comparison succeeds.
# Zero rows means: no such subscriber on this router, or the account is not
# eligible. The policy rejects, and never sees which of the two it was, so the
# database does not leak account existence across tenants.
authorize_check_query = "\
    SELECT 1::bigint, '%{control:NETISP-LookupKey}', 'Auth-Type', 'Accept', '=' \
    FROM public.radius_nas nas \
    JOIN public.service_accounts sa \
      ON sa.isp_id = nas.isp_id \
    WHERE nas.nas_identifier = '%{Called-Station-Id}' \
      AND sa.username = '%{control:NETISP-LookupKey}' \
      AND sa.status = 'active' \
      AND (sa.expires_at IS NULL OR sa.expires_at > now()) \
    LIMIT 1"

# --- authorize: the reply attributes ------------------------------------------
#
# One row per attribute; rlm_sql reads column 1 as the attribute name and
# column 2 as its value. Branches that would yield an empty value are filtered
# out rather than returned empty, so an Access-Accept never carries a blank
# Mikrotik-Rate-Limit that the router would then have to interpret.
#
# The rate limit is composed in SQL: the unit suffix is stripped from
# plans.speed_up / speed_down with regexp_replace and re-added once. "2 Mbps",
# "2M" and "2m" therefore all produce "2M/10M". The previous version appended
# the suffix to a value that already carried it and emitted "2MM/10MM", which
# MikroTik rejects outright.
#
# Only a hotspot plan produces a rate limit. PPPoE and fibre carry their speed on
# the interface, and sending a rate limit there would have the router shape its
# own WAN.
authorize_reply_query = "\
    SELECT 1::bigint, '%{control:NETISP-LookupKey}', 'Service-Type', 'Framed-User', '=' \
    FROM public.radius_nas nas \
    JOIN public.service_accounts sa \
      ON sa.isp_id = nas.isp_id \
     WHERE nas.nas_identifier = '%{Called-Station-Id}' \
       AND sa.username = '%{control:NETISP-LookupKey}' \
       AND sa.status = 'active' \
       AND (sa.expires_at IS NULL OR sa.expires_at > now()) \
    UNION ALL \
    SELECT 1::bigint, '%{control:NETISP-LookupKey}', 'Cleartext-Password', \
           coalesce(public.radius_cleartext_password( \
                       '%{control:NETISP-LookupKey}', nas.isp_id), ''), \
           '=' \
    FROM public.radius_nas nas \
    JOIN public.service_accounts sa \
      ON sa.isp_id = nas.isp_id \
     WHERE nas.nas_identifier = '%{Called-Station-Id}' \
       AND sa.username = '%{control:NETISP-LookupKey}' \
       AND sa.status = 'active' \
    UNION ALL \
    SELECT 1::bigint, '%{control:NETISP-LookupKey}', 'Mikrotik-Rate-Limit', \
           regexp_replace(pl.speed_up::text, '[^0-9.]', '', 'g') || 'M/' || \
           regexp_replace(pl.speed_down::text, '[^0-9.]', '', 'g') || 'M' \
         , '=' \
    FROM public.radius_nas nas \
    JOIN public.service_accounts sa ON sa.isp_id = nas.isp_id \
    LEFT JOIN public.plans pl ON pl.id = sa.plan_id \
     WHERE nas.nas_identifier = '%{Called-Station-Id}' \
       AND sa.username = '%{control:NETISP-LookupKey}' \
       AND sa.status = 'active' \
       AND (sa.expires_at IS NULL OR sa.expires_at > now()) \
       AND sa.service_type = 'hotspot' AND pl.id IS NOT NULL \
       AND regexp_replace(pl.speed_up::text, '[^0-9.]', '', 'g') <> ''"

# --- accounting: Acct-Start / Interim-Update / Acct-Stop ------------------------
#
# One statement per Acct-Status-Type rather than a single combined one. The
# previous design tried to write a column list that varied with the packet type,
# which in SQL means either a NULL overwrite or a second statement anyway.
#
# COALESCE keeps the last known value rather than nulling it, so an
# Interim-Update never erases counters the start recorded.
#
# Tenant-safe on two independent grounds: the session must already exist (it was
# opened by post-auth from a registered NAS) AND the NAS must match. A router
# cannot write accounting against another router's session even if it guesses the
# acct_session_id.
accounting {
    reference = "%{Acct-Status-Type}"

    type {
        start {
            query = "\
                INSERT INTO public.radius_sessions ( \
                    acct_session_id, isp_id, username, nas_identifier, \
                    framed_ip, called_station_id, nas_ip_address, nas_port, \
                    service_type, started_at, updated_at, last_update ) \
                SELECT '%{Acct-Session-Id}', nas.isp_id, \
                       '%{control:NETISP-LookupKey}', nas.nas_identifier, \
                       NULLIF('%{Framed-IP-Address}',''), \
                       NULLIF('%{Called-Station-Id}',''), \
                       NULLIF('%{NAS-IP-Address}',''), \
                       NULLIF('%{NAS-Port}','')::integer, \
                       sa.service_type, now(), now(), now() \
                  FROM public.radius_nas nas \
                  JOIN public.service_accounts sa \
                    ON sa.isp_id = nas.isp_id \
                   AND sa.username = '%{control:NETISP-LookupKey}' \
      AND sa.status = 'active' \
      AND (sa.expires_at IS NULL OR sa.expires_at > now()) \
                 WHERE nas.nas_identifier = \
                         '%{Called-Station-Id}' \
                ON CONFLICT (acct_session_id) DO UPDATE SET \
                    last_update = now(), updated_at = now()"
        }

        interim-update {
            query = "\
                UPDATE public.radius_sessions rs \
                   SET last_update = now(), updated_at = now(), \
                       last_interim_at = now(), \
                       input_octets = coalesce(NULLIF('%{Acct-Input-Octets}','')::bigint, rs.input_octets), \
                       output_octets = coalesce(NULLIF('%{Acct-Output-Octets}','')::bigint, rs.output_octets), \
                       session_time_secs = coalesce(NULLIF('%{Acct-Session-Time}','')::integer, rs.session_time_secs), \
                       framed_ip = coalesce(NULLIF('%{Framed-IP-Address}','')::text, rs.framed_ip) \
                 WHERE rs.acct_session_id = '%{Acct-Session-Id}' \
                   AND rs.nas_identifier = '%{Called-Station-Id}'"
        }

        stop {
            query = "\
                UPDATE public.radius_sessions rs \
                   SET last_update = now(), updated_at = now(), ended_at = now(), \
                       end_reason = coalesce(NULLIF('%{Acct-Terminate-Cause}',''), 'acct-stop'), \
                       terminate_cause = coalesce(NULLIF('%{Acct-Terminate-Cause}','')::integer, rs.terminate_cause), \
                       input_octets = coalesce(NULLIF('%{Acct-Input-Octets}','')::bigint, rs.input_octets), \
                       output_octets = coalesce(NULLIF('%{Acct-Output-Octets}','')::bigint, rs.output_octets), \
                       session_time_secs = coalesce(NULLIF('%{Acct-Session-Time}','')::integer, rs.session_time_secs) \
                 WHERE rs.acct_session_id = '%{Acct-Session-Id}' \
                   AND rs.nas_identifier = '%{Called-Station-Id}'"
        }

        on {
            query = "SELECT 1"
        }

        off {
            query = "SELECT 1"
        }
    }
}

# --- post-auth: open the session ------------------------------------------------
#
# Idempotent on acct_session_id, so a router that re-sends Acct-Start (several do,
# on a link flap) updates the existing row instead of creating a second session and
# double-counting the customer's time.
#
# isp_id comes from radius_nas, NOT from a username subquery. The previous version
# derived it from `WHERE username = ... LIMIT 1`, carrying the same cross-tenant
# ambiguity as authorize straight into the accounting table.
#
# If the subscriber is unknown on this router the INSERT ... SELECT matches no
# row and writes nothing: an unauthenticated packet cannot create a session.
post-auth {
    query = "\
        INSERT INTO public.radius_sessions ( \
            acct_session_id, isp_id, username, nas_identifier, \
            called_station_id, nas_ip_address, nas_port, \
            service_type, started_at, updated_at, last_update ) \
        SELECT '%{Acct-Session-Id}', nas.isp_id, \
               '%{control:NETISP-LookupKey}', nas.nas_identifier, \
               NULLIF('%{Called-Station-Id}',''), \
               NULLIF('%{NAS-IP-Address}',''), \
               NULLIF('%{NAS-Port}','')::integer, \
               sa.service_type, now(), now(), now() \
          FROM public.radius_nas nas \
          JOIN public.service_accounts sa \
            ON sa.isp_id = nas.isp_id \
           AND sa.username = '%{control:NETISP-LookupKey}' \
      AND sa.status = 'active' \
      AND (sa.expires_at IS NULL OR sa.expires_at > now()) \
         WHERE nas.nas_identifier = '%{Called-Station-Id}' \
        ON CONFLICT (acct_session_id) DO UPDATE SET \
            last_update = now(), updated_at = now()"
}
