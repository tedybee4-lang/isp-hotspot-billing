# =============================================================================
#  ISPFlow — FreeRADIUS SQL queries.
#
#  These read ISPFlow's own tables directly. There is no second subscriber store:
#  a payment, a suspension or a package change is a row change in Supabase, and
#  the next authentication reflects it without the router being touched.
#
#  Every statement is prepared and parameterised. No string is built from
#  user input, which matters here because FreeRADIUS interpolates `%{...}`
#  expansions into the query text — so a username containing a quote would
#  otherwise be SQL injection with a customer-facing trigger.
#
#  Tables
#  ------
#    service_accounts  the login credential and its lifecycle state
#    clients           the billing customer
#    plans             the package and its speeds
#    radius_sessions   live sessions opened by post-auth
#
#  Tenant safety
#  -------------
#  Nothing takes an isp_id parameter. The tenant is derived from the service
#  account row that the unique (isp_id, username) constraint already selected,
#  so there is no way to ask for another ISP's subscribers.
# =============================================================================

# ── authorize: load one subscriber ────────────────────────────────────────────
#
# One row, because (isp_id, username) is unique. A duplicate is impossible
# rather than merely unlikely.
#
# `rate_limit` is composed here from the plan rather than read from a single
# column, because MikroTik's own syntax is "<upload>/<download>" with an optional
# suffix. Composing it in SQL keeps that syntax in one place instead of spread
# across FreeRADIUS, the worker and the panel.
query_name = "ISPFlow/Authorize/LoadAccount"

query {
    column_names = \
        accountStatus, \
        expiresAt, \
        rateLimit, \
        simultaneousUse, \
        clientId, \
        planName, \
        accountId

    query = "\
        SELECT
            sa.status::text                       AS accountStatus, \
            coalesce(to_char(sa.expires_at, 'YYYY-MM-DD HH24:MI:SS'), '') \
                                                   AS expiresAt, \
            -- Rate limit, in MikroTik's own "upload/download" syntax.
            --
            -- plans.speed_up / speed_down are stored as TEXT and are commonly
            -- written with a unit suffix by whoever entered them ("10M", "2m",
            -- "512k"). Concatenating them raw produced "2MM/10MM", which the
            -- router rejects — so the suffix is normalised to a bare number here
            -- and the unit is added once.
            --
            -- Only a hotspot plan implies a rate limit. A PPPoE or fibre package
            -- carries its speed on the interface, and sending one would have the
            -- router shape its own WAN.
            CASE WHEN sa.service_type = 'hotspot' \
                 THEN regexp_replace(pl.speed_up::text, '[^0-9.]', '', 'g')
                      || 'M/'
                      || regexp_replace(pl.speed_down::text, '[^0-9.]', '', 'g')
                      || 'M' \
                 ELSE '' END                       AS rateLimit, \
            -- Simultaneous-device limit. service_accounts has no such column
            -- (it is the credential record); the limit lives on the
            -- radius_accounts mirror the worker writes. COALESCE falls back to
            -- 1 so a subscriber with no mirror row yet still gets in rather
            -- than being locked out by a missing join.
            coalesce((SELECT ra.simultaneous_use FROM public.radius_accounts ra \
                       WHERE ra.client_id IS NOT DISTINCT FROM sa.client_id \
                         AND ra.isp_id = sa.isp_id LIMIT 1), 1)::text \
                                                   AS simultaneousUse, \
            coalesce(sa.client_id::text, '')       AS clientId, \
            coalesce(pl.name, '')                  AS planName, \
            sa.id::text                            AS accountId \
        FROM public.service_accounts sa \
        LEFT JOIN public.plans pl ON pl.id = sa.plan_id \
        WHERE sa.username = '%{sql_escape:%{NETISP::LookupKey}}' \
        LIMIT 1"
}

# ── post-auth: open a session ────────────────────────────────────────────────
#
# Idempotent on acct_session_id so a router that re-sends Acct-Start (some do,
# on a link flap) updates the existing row rather than creating a second session
# and double-counting the customer's time.
query_name = "ISPFlow/PostAuth/OpenSession"

query {
    column_names = \

    query = "\
        INSERT INTO public.radius_sessions ( \
            acct_session_id, isp_id, username, node_id, \
            framed_ip, called_station_id, nas_ip_address, \
            service_type, started_at, updated_at \
        ) \
        VALUES ( \
            '%{sql_escape:%{NETISP::SessionStart}}', \
            (SELECT isp_id FROM public.service_accounts \
              WHERE username = '%{sql_escape:%{User-Name}}' LIMIT 1), \
            '%{sql_escape:%{User-Name}}', \
            NULL, \
            NULLIF('%{sql_escape:%{Framed-IP-Address}}', ''), \
            NULLIF('%{sql_escape:%{Called-Station-Id}}', ''), \
            NULLIF('%{sql_escape:%{NAS-IP-Address}}', ''), \
            (SELECT service_type FROM public.service_accounts \
              WHERE username = '%{sql_escape:%{User-Name}}' LIMIT 1), \
            now(), now() \
        ) \
        ON CONFLICT (acct_session_id) DO UPDATE SET \
            last_update  = now(), \
            updated_at   = now(), \
            framed_ip    = COALESCE(EXCLUDED.framed_ip, radius_sessions.framed_ip) \
        RETURNING id"
}
