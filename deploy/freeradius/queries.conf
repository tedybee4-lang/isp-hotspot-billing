# =============================================================================
#  ISPFlow — FreeRADIUS SQL queries.
#
#  These read ISPFlow's own tables directly. There is no second subscriber store:
#  a payment, a suspension or a package change is a row change in Supabase, and
#  the next authentication reflects it without the router being touched.
#
#  Every expansion is %{sql_escape:...}. FreeRADIUS interpolates %{...} into the
#  query text, so an unescaped username containing a quote would otherwise be SQL
#  injection with a customer-facing trigger.
#
#  Tenant safety — the rule this file exists to enforce
#  ------------------------------------------------------
#  NOTHING is looked up by username alone.
#
#  The previous query was `WHERE sa.username = '%{User-Name}' LIMIT 1`. Username
#  is unique per (isp_id, username), not globally, so with two ISPs both running
#  a "john" that could return either tenant's subscriber: the wrong customer
#  authenticated on the wrong ISP's router, at the wrong price. The old comment
#  claimed this "can never return two candidates". It could.
#
#  The tenant is now resolved FIRST, from the router that sent the packet, via
#  the radius_nas table. A NAS that is not registered returns no rows, so an
#  unknown router cannot ask about anybody. Only then is the subscriber looked
#  up, scoped by that tenant. Order matters: resolve, then scope.
#
#  Passwords
#  ---------
#  service_accounts.password_encrypted holds an OpenPGP-symmetric ciphertext from
#  set_service_account_password(). The key is NOT in this database; it is held by
#  the RADIUS host and injected per connection as the session GUC
#  `netisp.radius_key` (see sql.conf `options`). It is decrypted here for the
#  duration of one authentication because CHAP and MS-CHAP — which MikroTik uses
#  for PPPoE, and usually for HotSpot — cannot be verified against a one-way
#  hash. It is never logged and never returned to the panel.
# =============================================================================

# ── authorize: load one subscriber, scoped to the NAS that asked ───────────────
#
# One row, guaranteed: radius_nas.nas_identifier is unique so the tenant is
# single-valued, and (isp_id, username) is unique so the subscriber is too.
query_name = "ISPFlow/Authorize/LoadAccount"

query {
    column_names = \
        cleartextPassword, \
        accountStatus, \
        expiresAt, \
        rateLimit, \
        simultaneousUse, \
        clientId, \
        planName, \
        ispId

    query = "\
        SELECT \
            CASE WHEN sa.password_encrypted IS NULL THEN '' \
                 ELSE extensions.pgp_sym_decrypt( \
                        sa.password_encrypted, \
                        current_setting('netisp.radius_key', true) ) END \
                                                        AS cleartextPassword, \
            sa.status::text                       AS accountStatus, \
            coalesce(to_char(sa.expires_at, 'YYYY-MM-DD HH24:MI:SS'), '') \
                                                   AS expiresAt, \
            CASE WHEN sa.service_type = 'hotspot' \
                 THEN regexp_replace(pl.speed_up::text, '[^0-9.]', '', 'g') \
                      || 'M/' \
                      || regexp_replace(pl.speed_down::text, '[^0-9.]', '', 'g') \
                      || 'M' \
                 ELSE '' END                       AS rateLimit, \
            coalesce((SELECT ra.simultaneous_use \
                        FROM public.radius_accounts ra \
                       WHERE ra.client_id IS NOT DISTINCT FROM sa.client_id \
                         AND ra.isp_id = sa.isp_id LIMIT 1), 1)::text \
                                                   AS simultaneousUse, \
            coalesce(sa.client_id::text, '')       AS clientId, \
            coalesce(pl.name, '')                  AS planName, \
            sa.isp_id::text                        AS ispId \
        FROM public.radius_nas nas \
        JOIN public.service_accounts sa \
          ON sa.isp_id = nas.isp_id \
        LEFT JOIN public.plans pl ON pl.id = sa.plan_id \
        WHERE nas.nas_identifier = '%{sql_escape:%{Called-Station-Id}}' \
          AND sa.username = '%{sql_escape:%{NETISP::LookupKey}}' \
        LIMIT 1"
}

# ── post-auth: open a session ────────────────────────────────────────────────
#
# Idempotent on acct_session_id, so a router that re-sends Acct-Start (several
# do, on a link flap) updates the existing row instead of creating a second
# session and double-counting the customer's time.
#
# isp_id comes from radius_nas, NOT from a username subquery. The previous
# version derived it from `WHERE username = ... LIMIT 1`, which carried the same
# cross-tenant ambiguity as the authorize query straight into the accounting
# table.
query_name = "ISPFlow/PostAuth/OpenSession"

query {
    column_names = sessionRowId

    query = "\
        INSERT INTO public.radius_sessions ( \
            acct_session_id, isp_id, username, nas_identifier, \
            framed_ip, called_station_id, nas_ip_address, nas_port, \
            service_type, started_at, updated_at \
        ) \
        SELECT \
            '%{sql_escape:%{NETISP::SessionStart}}', \
            nas.isp_id, \
            '%{sql_escape:%{User-Name}}', \
            nas.nas_identifier, \
            NULLIF('%{sql_escape:%{Framed-IP-Address}}', ''), \
            NULLIF('%{sql_escape:%{Called-Station-Id}}', ''), \
            NULLIF('%{sql_escape:%{NAS-IP-Address}}', ''), \
            NULLIF('%{sql_escape:%{NAS-Port}}', '')::integer, \
            sa.service_type, \
            now(), now() \
        FROM public.radius_nas nas \
        JOIN public.service_accounts sa \
          ON sa.isp_id = nas.isp_id \
         AND sa.username = '%{sql_escape:%{User-Name}}' \
        WHERE nas.nas_identifier = '%{sql_escape:%{Called-Station-Id}}' \
        ON CONFLICT (acct_session_id) DO UPDATE SET \
            last_update  = now(), \
            updated_at   = now(), \
            framed_ip    = COALESCE(EXCLUDED.framed_ip, radius_sessions.framed_ip) \
        RETURNING id"
}

# ── accounting: Acct-Start / Interim-Update / Acct-Stop ────────────────────────
#
# One statement handles all three, because they differ only in which columns are
# present: Acct-Start has no byte counters and no terminate-cause, Interim-Update
# has counters, Acct-Stop has both. COALESCE keeps the last known value rather
# than nulling it, so an Interim-Update never erases counters the start or the
# previous interim recorded.
#
# Tenant-safe on two independent grounds: the session must already exist (it was
# opened by post-auth from a registered NAS) AND the NAS must match. A router
# cannot write accounting against another router's session even if it guesses
# the acct_session_id.
query_name = "ISPFlow/Accounting/Record"

query {
    column_names = sessionRowId

    query = "\
        UPDATE public.radius_sessions rs \
           SET last_update = now(), \
               updated_at  = now(), \
               last_interim_at = CASE \
                   WHEN '%{sql_escape:%{Acct-Status-Type}}' = 'Interim-Update' \
                   THEN now() ELSE rs.last_interim_at END, \
               ended_at = CASE \
                   WHEN '%{sql_escape:%{Acct-Status-Type}}' = 'Stop' \
                   THEN now() ELSE rs.ended_at END, \
               end_reason = CASE \
                   WHEN '%{sql_escape:%{Acct-Status-Type}}' = 'Stop' \
                   THEN coalesce(NULLIF('%{sql_escape:%{Acct-Terminate-Cause}}','') \
                                    ::text, 'acct-stop') \
                   ELSE rs.end_reason END, \
               terminate_cause = coalesce( \
                   NULLIF('%{sql_escape:%{Acct-Terminate-Cause}}','')::integer, \
                   rs.terminate_cause ), \
               input_octets  = coalesce( \
                   NULLIF('%{sql_escape:%{Acct-Input-Octets}}','')::bigint, \
                   rs.input_octets ), \
               output_octets = coalesce( \
                   NULLIF('%{sql_escape:%{Acct-Output-Octets}}','')::bigint, \
                   rs.output_octets ), \
               session_time_secs = coalesce( \
                   NULLIF('%{sql_escape:%{Acct-Session-Time}}','')::integer, \
                   rs.session_time_secs ), \
               framed_ip = coalesce( \
                   NULLIF('%{sql_escape:%{Framed-IP-Address}}','')::text, \
                   rs.framed_ip ) \
         WHERE rs.acct_session_id = \
                 '%{sql_escape:%{NETISP::SessionStart}}' \
           AND rs.nas_identifier = \
                 '%{sql_escape:%{Called-Station-Id}}' \
        RETURNING rs.id"
}