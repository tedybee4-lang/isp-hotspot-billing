# =============================================================================
#  ISPFlow - FreeRADIUS sql module configuration.
#
#  WARNING: this file IS the module configuration. rlm_sql has no "sqlconf"
#  directive. Anything a module file does not set falls back to the defaults
#  compiled into rlm_sql, which are
#
#      driver = "rlm_sql_null"    radius_db = "radius"
#
#  The module then loads rlm_sql_null, registers no query names, and the policy
#  fails. Shipping a separate sql.conf and pointing a module file at it does
#  nothing at all; this file has to be mods-enabled/sql itself, and it carries
#  the database password and the RADIUS host key, so it is installed mode 0640
#  root:freerad because the server runs as the freerad user.
#
#  The prepared statements in
#  /etc/freeradius/3.0/mods-available/netisp/queries.conf
#  are pulled in by a $INCLUDE INSIDE this sql { } block, which is what the stock
#  mods-config/sql/main/<dialect>/queries.conf does.
#
#  Installed by deploy/install-vps.sh.
# =============================================================================

sql {
    # The driver value is the FULL MODULE NAME, not the short dialect name.
    #
    # This was the single reason the sql module did not instantiate. Measured on
    # Ubuntu 24.04 / FreeRADIUS 3.2.5, in order:
    #
    #   driver = "postgresql"
    #       -> Could not link driver postgresql:
    #          /usr/lib/freeradius/postgresql.so: cannot open shared object file
    #
    #   driver = "postgresql"  + symlink postgresql.so -> rlm_sql_postgresql.so
    #       -> Could not link symbol postgresql:
    #          /usr/lib/freeradius/postgresql.so: undefined symbol: postgresql
    #
    # rlm_sql resolves `driver` to BOTH the library path <libdir>/<driver>.so AND
    # the exported symbol <driver>. Ubuntu ships rlm_sql_postgresql.so exporting
    # the symbol rlm_sql_postgresql, so BOTH parts have to carry that prefix. The
    # short name satisfies neither part; the full name satisfies both and is what
    # upstream FreeRADIUS expects.
    #
    # Note that "pgsql", which most examples online use, is not this library at
    # all: it fails the same way, one line earlier.
    driver = "rlm_sql_postgresql"

    # POOLER_HOST is substituted by install-vps.sh.
    #
    # This must be the Supabase connection pooler, NOT db.<ref>.supabase.co. The
    # direct database host publishes only an AAAA record; a host with no global
    # IPv6 route cannot reach it, and psql fails with "Network is unreachable"
    # while HTTPS to the same project works fine. The pooler is reached over IPv4
    # and is the supported path.
    #
    # Port 5432 is the SESSION pooler, not the transaction pooler on 6543.
    # FreeRADIUS holds connections across requests; the transaction pooler hands
    # the connection back between transactions and breaks that.
    server = "POOLER_HOST"
    port = 5432

    # rlm_sql calls this `radius_db`, NOT `database`. `database` is silently
    # ignored, so the server connected to the compiled-in default "radius" and
    # every query failed against a database that does not exist.
    radius_db = "postgres"

    # Pooler usernames are "<role>.<project-ref>". The role is radius_reader, which
    # has BYPASSRLS and only the grants ISPFlow's queries need. Never the Supabase
    # service-role credential.
    login = "POOLER_USER"
    password = "POOLER_PASSWORD"

    # Let the driver escape every attribute used in a query.
    #
    # `%{sql_escape:...}` does NOT exist in FreeRADIUS 3.2.5. It is a
    # FreeRADIUS 2 function, and in 3 it fails to parse:
    #
    #     Unknown module
    #
    # with the caret under the `sql_escape` token. Escaping is the driver's
    # job now, and auto_escape routes every expansion through the postgresql
    # driver's own PQescapeString. That is both correct and safer than the old
    # mime-encoding of unsafe characters: it escapes for the actual database
    # rather than for FreeRADIUS's internal representation.
    auto_escape = yes

    tls = require

    # FreeRADIUS forks per request; without pooling Postgres runs out of
    # connections under load.
    max_connections = 20

    # search_path: a role whose search_path is empty fails every query with
    # "relation does not exist", which identifies nothing.
    #
    # NOTE: the RADIUS host key is deliberately NOT passed here as a GUC.
    # Measured on the host, the pooler does not forward the libpq `options`
    # parameter, so `-c netisp.radius_key=...` was silently dropped and
    # current_setting('netisp.radius_key', true) was always NULL. Every password
    # decrypted to empty and pap rejected every login. It also meant the key sat
    # in a config file that `freeradius -X` prints to the log on every debug run.
    #
    # Decryption now happens inside radius_cleartext_password(), a SECURITY
    # DEFINER function that reads the key itself - the same way
    # set_service_account_password() encrypts with it. The key never reaches
    # FreeRADIUS at all.
    options = "search_path=public"

    # A slow query must not hold a RADIUS thread: the router gives up after a few
    # seconds and the customer sees a failed login, which is indistinguishable from
    # bad credentials.
    timeout = 5
}
