# =============================================================================
#  ISPFlow — FreeRADIUS database connection.
#
#  Reads ISPFlow's own Supabase Postgres instance. There is no separate RADIUS
#  database: a payment, a suspension or a package change is a row change, and the
#  next authentication reflects it.
#
#  SECURITY — read this before filling it in.
#
#  A RADIUS lookup has no Supabase JWT, so RLS cannot be evaluated for it and the
#  connecting role must be granted BYPASSRLS. That sounds alarming because it is:
#  bypassrls is a property of the ROLE. What limits the damage is the GRANT list,
#  and it is deliberately tiny:
#
#      SELECT          service_accounts, plans, radius_accounts, clients
#      SELECT          radius_nas            (router -> tenant resolution)
#      INSERT/UPDATE   radius_sessions       (accounting)
#
#  Verified from the RADIUS host: SELECT on router_credentials and on payments is
#  refused, and the role is not superuser, cannot create databases and cannot
#  create roles. It also has NO grant on netisp_internal_keys, so a compromise of
#  this host cannot read the key that decrypts subscriber passwords.
#
#      create role radius_reader login password '<generated>';
#      alter role radius_reader bypassrls;
#      grant connect on database postgres to radius_reader;
#      grant usage on schema public to radius_reader;
#      grant select on public.service_accounts to radius_reader;
#      grant select on public.plans            to radius_reader;
#      grant select on public.radius_accounts  to radius_reader;
#      grant select on public.clients          to radius_reader;
#      grant select on public.radius_nas       to radius_reader;
#      grant insert, update on public.radius_sessions to radius_reader;
#
#  ── Why the POOLER, not db.<ref>.supabase.co ──────────────────────────────────
#  The direct database host publishes ONLY an AAAA record. A host with no global
#  IPv6 route cannot reach it: psql fails with "Network is unreachable" while
#  HTTPS to the same project works fine. The Supabase connection pooler is
#  reached over IPv4 and is the supported path.
#
#  Port 5432 is the SESSION pooler, not the transaction pooler on 6543. FreeRADIUS
#  needs a persistent connection across requests; the transaction pooler returns
#  the connection between transactions and breaks that.
#
#  Pooler usernames are "<role>.<project-ref>".
#
#  This file is installed mode 0640 because it holds a password.
# =============================================================================

sql {
    # The driver name must match the library name.
    #
    # Ubuntu's freeradius-postgresql package installs
    # /usr/lib/freeradius/rlm_sql_postgresql.so, so the driver is "postgresql".
    # Writing "pgsql" -- which is what most examples online use, because that is
    # the name upstream FreeRADIUS uses -- loads nothing, the sql module fails to
    # instantiate, and NONE of its functions are registered. Every
    # sql_query() in the policy then fails to parse with the misleading
    #   Parse error after "sql_query": unexpected token "("
    # which looks like a policy syntax fault and is not one.
    driver = "postgresql"

    server = "POOLER_HOST"
    port = 5432
    database = "postgres"

    login = "POOLER_USER"
    password = "PASTE_THE_GENERATED_PASSWORD_HERE"

    # TLS is mandatory to the database.
    tls = require

    # Connections are pooled: FreeRADIUS forks per request, and without pooling
    # Postgres runs out of connections under load.
    max_connections = 20

    # Keep the session pinned to the public schema. Without this, a role whose
    # search_path is empty fails on every query with "relation does not exist",
    # which identifies nothing.
    options = "search_path=public -c netisp.radius_key=PASTE_THE_RADIUS_HOST_KEY_HERE"

    # Statement timeout. A slow query must not hold a RADIUS thread: the router
    # gives up after a few seconds and the customer sees a failed login, which is
    # indistinguishable from bad credentials.
    timeout = 5
}

# ── Prepared statements ──────────────────────────────────────────────────────
#
# Loaded by default; `file` points at the same directory this was installed to.
readall_group_file = ${confdir}/mods-available/netisp/queries.conf