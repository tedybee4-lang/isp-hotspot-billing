name: Build & Deploy ISP Billing Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-billing-backend
  COMPOSE_DIR: /opt/ispflow-backend

# Independent deployment pipeline (VPS Docker Compose only; no K8s /
# legacy GitOps repo).
# Builds backend/docker/Dockerfile from the REPO ROOT (paths in that Dockerfile
# are relative to backend/), publishes to GHCR, then deploys to the VPS with
# Docker Compose.
# Requires GitHub Actions secrets (set via Settings -> Secrets and variables -> Actions):
#   - GITHUB_TOKEN          (auto; used to publish isp-billing-backend to GHCR)
#   - VPS_DEPLOY_KEY        (SSH private key for the deployment account)
#   - VPS_HOST              (VPS IP/host, default 87.76.137.72)
#   - VPS_USER              (SSH user, default root)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS (Docker Compose)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '87.76.137.72' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          COMPOSE_DIR: /opt/ispflow-backend
        run: |
          export DEPLOY_HOST="${VPS_HOST}"
          export DEPLOY_USER="${VPS_USER}"
          export COMPOSE_DIR="${COMPOSE_DIR}"

          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          eval "$(ssh-agent -s)"
          echo "$SSH_KEY" | tr -d "\r" | ssh-add - >/dev/null

          # Back up existing compose files before updating
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "if [ -f /opt/ispflow-backend/docker-compose.yml ]; then cp -a /opt/ispflow-backend/docker-compose.yml /opt/ispflow-backend/docker-compose.yml.bak.$(date +%s); fi; if [ -f /opt/ispflow-backend/.env ]; then cp -a /opt/ispflow-backend/.env /opt/ispflow-backend/.env.bak.$(date +%s); fi"

          # Update docker-compose.yml from repo (ensures Supabase env vars are defined)
          scp docker-compose.vps.yml "$DEPLOY_USER@$DEPLOY_HOST:/opt/ispflow-backend/docker-compose.yml"

          # Update .env with new frontend URL and CORS settings
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'cat > /opt/ispflow-backend/.env << "ENVEOF"
DATABASE_URL=postgresql+asyncpg://ispflow:xxx@127.0.0.1:5432/ispflow
REDIS_URL=redis://127.0.0.1:6379/0
CELERY_BROKER_URL=redis://127.0.0.1:6379/1
CELERY_RESULT_BACKEND=redis://127.0.0.1:6379/2
SECRET_KEY=5ksk0V2mqWjPHmEv2_qVd-7woyPxbUTysoNPDRFHDVPlPA625sqH24BZHYe_YhiD
ENCRYPTION_KEY=
MASTER_PASSWORD=4Amn2zG_CbrH1Gcmpo4OmgsboPVBkqYxAAsfpwdLmgQ
GLOBAL_ADMIN_EMAIL=admin@example.com
GLOBAL_ADMIN_PASSWORD=ChangeMe_2024!@#$
MIKROTIK_API_PASSWORD=ChangeMe_2024!@#$
FRONTEND_URL=https://ispflow.vercel.app
BACKEND_URL=https://api.87-76-137-72.sslip.io
CORS_ORIGINS=["https://ispflow.vercel.app"]
SUPABASE_AUTH_URL=https://dcqcunmdhyonaewwuama.supabase.co
SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjcWN1bm1kaHlvbmFld3d1YW1hIiwicm9sZSI6ImFub255IiwiaWF0IjoxNzM3NTc1Njc2LCJleHAiOjIwNTMxNTE2NzZ9.dcKZgQJp-bWAn_6v8KPU9TV_qC3U_bSnD4kmV_V6Pjk
ENVIRONMENT=production
HOST=0.0.0.0
PORT=8000
DEBUG=false
ENVEOF'

          # Pull the new image and restart the backend
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/ispflow-backend && docker-compose pull isp-billing-backend && docker-compose up -d isp-billing-backend"

          # Health check (retry for ~60s)
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'for i in $(seq 1 30); do if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then echo "backend healthy on $DEPLOY_HOST"; exit 0; fi; sleep 2; done; echo "backend NOT healthy"; exit 1'