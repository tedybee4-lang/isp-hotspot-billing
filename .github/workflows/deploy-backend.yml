name: Build & Deploy ISP Billing Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-billing-backend
  COMPOSE_DIR: /opt/ispflow-backend

# Independent deployment pipeline (VPS Docker Compose only; no K8s /
# legacy GitOps repo).
# Builds backend/docker/Dockerfile from the REPO ROOT (paths in that Dockerfile
# are relative to backend/), publishes to GHCR, then deploys to the VPS with
# Docker Compose.
# Requires GitHub Actions secrets (set via Settings -> Secrets and variables -> Actions):
#   - GITHUB_TOKEN          (auto; used to publish isp-billing-backend to GHCR)
#   - VPS_DEPLOY_KEY        (SSH private key for the deployment account)
#   - VPS_HOST              (VPS IP/host, default 87.76.137.72)
#   - VPS_USER              (SSH user, default root)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS (Docker Compose)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '87.76.137.72' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          COMPOSE_DIR: /opt/ispflow-backend
        run: |
          export DEPLOY_HOST="${VPS_HOST}"
          export DEPLOY_USER="${VPS_USER}"
          export COMPOSE_DIR="${COMPOSE_DIR}"

          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          eval "$(ssh-agent -s)"
          echo "$SSH_KEY" | tr -d "\r" | ssh-add - >/dev/null

          # Back up existing compose files before updating
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "if [ -f $COMPOSE_DIR/docker-compose.yml ]; then cp -a $COMPOSE_DIR/docker-compose.yml $COMPOSE_DIR/docker-compose.yml.bak.$(date +%s); fi; if [ -f $COMPOSE_DIR/.env ]; then cp -a $COMPOSE_DIR/.env $COMPOSE_DIR/.env.bak.$(date +%s); fi"

          # Pull the new image and restart the backend
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $COMPOSE_DIR && docker compose pull isp-billing-backend && docker compose up -d isp-billing-backend"

          # Health check (retry for ~60s)
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "for i in $(seq 1 30); do if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then echo "backend healthy on $DEPLOY_HOST"; exit 0; fi; sleep 2; done; echo "backend NOT healthy"; exit 1"