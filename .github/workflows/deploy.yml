name: 🚀 CI — Build & Verify

# Hosting architecture: the frontend is deployed by Vercel's GitHub integration
# (project prj_Ze350DIlVGCyAVw1M9ZeBhezLSai, production branch `main`) and the API
# is served from the VPS at https://ispbillingapi.codevertexafrica.com and proxied
# through vercel.json rewrites. GitHub Pages is NOT the hosting target, so this
# workflow only builds and verifies; it never publishes an artifact to Pages.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  frontend:
    name: 🔨 Frontend — typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Validate vercel.json rewrites
        run: |
          set -euo pipefail
          node -e '
            const cfg = require("./vercel.json");
            const rewrites = cfg.rewrites ?? [];
            const fail = (m) => { console.error(m); process.exit(1); };
            const api = rewrites.findIndex((r) => r.source === "/api/:path*");
            const health = rewrites.findIndex((r) => r.source === "/health");
            const spa = rewrites.findIndex((r) => r.destination === "/index.html");
            if (api === -1) fail("missing /api/:path* rewrite");
            if (health === -1) fail("missing /health rewrite");
            if (spa === -1) fail("missing SPA fallback rewrite");
            if (api > spa || health > spa) fail("api/health rewrites must precede the SPA fallback");
            if (!rewrites[api].destination.includes("/api/:path*")) fail("/api rewrite must preserve the path");
            if (!rewrites[health].destination.endsWith("/health")) fail("/health rewrite must target the backend health route");
            console.log("vercel.json routing OK:", JSON.stringify(rewrites));
          '

  # ─────────────────────────────────────────────────────────
  worker:
    name: ⚙️ Worker — typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefix worker

      - name: TypeScript check
        run: npm run typecheck --prefix worker

      - name: Unit tests (Vitest)
        run: npm test --prefix worker

      - name: Build worker bundle
        run: npm run build --prefix worker
