name: 🚀 CI — Build & Verify

# Node 24 is required, not cosmetic. jsdom 30 depends on undici ^8, which
# declares engines.node >=22.19.0. On Node 20 undici throws
# "webidl.util.markAsUncloneable is not a function" while jsdom initialises, so
# every jsdom (src/**) test file dies before collecting: the run silently
# reported 23 files instead of 37 and produced 14 "unhandled errors" that
# vitest warned could cause false-positive passes.
# NOTE: `npm run typecheck` / `tsc --noEmit` and `vite build` are unaffected.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  frontend:
    name: 🔨 Frontend — typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Verify Node satisfies every declared engine
        run: |
          set -euo pipefail
          node --version
          node -e '
            const lock = require("./package-lock.json");
            const [maj, min, pat] = process.versions.node.split(".").map(Number);
            const atLeast = (a, b, c) =>
              maj > a || (maj === a && (min > b || (min === b && pat >= c)));
            // Ranges are OR-ed (e.g. "^22.22.2 || ^24.15.0 || >=26.0.0"), so any
            // single satisfied alternative is enough. Parsing only the first
            // token would report a false failure on exactly the supported Node.
            const satisfied = (req) =>
              String(req).split("||").some((alt) => {
                const t = alt.trim();
                const ge = />=\s*(\d+)\.(\d+)\.(\d+)/.exec(t);
                if (ge) return atLeast(+ge[1], +ge[2], +ge[3]);
                const caret = /\^\s*(\d+)\.(\d+)\.(\d+)/.exec(t);
                if (caret) return atLeast(+caret[1], +caret[2], +caret[3]);
                const plain = /^(\d+)\.(\d+)\.(\d+)$/.exec(t);
                if (plain) return atLeast(+plain[1], +plain[2], +plain[3]);
                return true;
              });
            let bad = 0;
            for (const [p, meta] of Object.entries(lock.packages ?? {})) {
              const req = meta && meta.engines && meta.engines.node;
              if (req && !satisfied(req)) {
                console.error(`UNSATISFIED: ${p} requires node ${req}`);
                bad++;
              }
            }
            if (bad) { console.error(`${bad} package(s) unsatisfied on this Node`); process.exit(1); }
            console.log("every declared engine is satisfied");
          '

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Assert every unit test file actually ran
        run: |
          set -euo pipefail
          # Guards against a silent-collection failure: a test file that cannot
          # even start is reported as neither passed nor failed, so the count has
          # to be checked rather than trusted. Node 20 vs jsdom/undici made all
          # 14 jsdom files vanish this way (23 reported instead of 37).
          # e2e/*.spec.ts are Playwright specs (`npm run test:e2e`) and are
          # correctly outside vitest, so they are excluded from the expectation.
          expected=$(git ls-files | grep -E '\.(test|spec)\.tsx?$' | grep -v '^e2e/' | wc -l | tr -d ' ')
          actual=$(node_modules/.bin/vitest list --filesOnly | wc -l | tr -d ' ')
          echo "tracked unit test files: $expected / vitest collects: $actual"
          if [ "$actual" -lt "$expected" ]; then
            echo "vitest is not collecting every unit test file" >&2
            exit 1
          fi

      - name: Build production bundle
        run: npm run build

      - name: Validate vercel.json rewrites
        run: |
          set -euo pipefail
          node -e '
            const cfg = require("./vercel.json");
            const rewrites = cfg.rewrites ?? [];
            const fail = (m) => { console.error(m); process.exit(1); };
            const api = rewrites.findIndex((r) => r.source === "/api/(.*)");
            const apiLegacy = rewrites.findIndex((r) => r.source === "/api/:path*");
            const apiSlashLegacy = rewrites.findIndex((r) => r.source === "/api/:path*/");
            const health = rewrites.findIndex((r) => r.source === "/health");
            const spa = rewrites.findIndex((r) => r.destination === "/index.html");
            if (api === -1 && (apiLegacy === -1 || apiSlashLegacy === -1)) fail("missing /api/(.*) rewrite (trailing-slash-safe API proxy)");
            // Regression guard for the production /app/provision bug: the old
            // /api/:path* rule compiled with strict:true and did NOT match
            // trailing-slash routes like /api/v1/routers/ (FastAPI collection
            // URLs). /api/(.*) matches both slash forms, so those requests no
            // longer fall through to the SPA.
            if (health === -1) fail("missing /health rewrite");
            if (spa === -1) fail("missing SPA fallback rewrite");
            if (api !== -1 && api > spa) fail("api/health rewrites must precede the SPA fallback");
            if (api === -1 && (apiLegacy > spa || apiSlashLegacy > spa)) fail("api/health rewrites must precede the SPA fallback");
            if (api !== -1 && !rewrites[api].destination.includes("/api/$1")) fail("/api rewrite must preserve the path");
            if (api === -1) {
              if (!rewrites[apiLegacy].destination.includes("/api/:path*")) fail("/api rewrite must preserve the path");
              if (!rewrites[apiSlashLegacy].destination.includes("/api/:path*/")) fail("/api/ rewrite must preserve the trailing slash");
            }
            if (!rewrites[health].destination.endsWith("/health")) fail("/health rewrite must target the backend health route");
            // Compile with Vercel's own matcher and assert the exact failing
            // request from production resolves to the VPS API.
            const { convertRewrites } = require("@vercel/routing-utils");
            const routes = convertRewrites(rewrites);
            const first = (p) => routes.find((r) => r.src && new RegExp(r.src).test(p));
            const target = first("/api/v1/routers/");
            if (!target || !String(target.dest).startsWith("https://ispbillingapi.codevertexafrica.com/api/")) {
              fail("/api/v1/routers/ must be proxied to the VPS API, not the SPA fallback");
            }
            console.log("vercel.json routing OK:", JSON.stringify(rewrites));
          '

  # ─────────────────────────────────────────────────────────
  worker:
    name: ⚙️ Worker — typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefix worker

      - name: TypeScript check
        run: npm run typecheck --prefix worker

      - name: Unit tests (Vitest)
        run: npm test --prefix worker

      - name: Build worker bundle
        run: npm run build --prefix worker

