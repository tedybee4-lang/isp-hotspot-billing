---
name: 🐛 Bug Report
description: Found something broken? Help us fix it fast.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for reporting a bug! 🙏
        Please fill in as much detail as possible to help us fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I click X, Y happens instead of Z..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: "I expected..."
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Node v20, Chrome 124, Windows 11"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which component?
      options:
        - Admin Dashboard
        - Hotspot Portal
        - Client Billing
        - M-Pesa / Daraja API
        - MikroTik Config Generator
        - Analytics
        - Network Status
        - Landing Page
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console logs / screenshots
      description: Paste any browser console errors here.

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before submitting
          required: true
        - label: I can reproduce this consistently
          required: true
